name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [email, storage, kms, twitter, examples]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test ./...

      - name: Run race tests
        run: go test -race ./...

      - name: Run go vet
        run: go vet ./...

  staticcheck:
    name: Staticcheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [email, storage, kms, twitter, examples]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Run staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          working-directory: ${{ matrix.module }}
          install-go: false

  govulncheck:
    name: Govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [email, storage, kms, twitter, examples]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    env:
      GOPRIVATE: github.com/shepard-labs/*
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        continue-on-error: true
        run: govulncheck ./...

  release:
    name: Release (${{ matrix.module }})
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test, staticcheck]
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        module: [email, storage, kms, twitter]
    uses: shepard-labs/.github/.github/workflows/module-release.yml@main
    with:
      module: ${{ matrix.module }}
